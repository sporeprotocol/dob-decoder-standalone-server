name: Docker

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and smoke-test linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build --pull --platform "linux/${{ matrix.arch }}" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag dob-decoder-server:local .

      - name: Validate Compose and smoke-test both networks
        run: |
          compose=(docker compose -f compose.example.yaml)
          cleanup() {
            if [[ "$1" != 0 ]]; then
              "${compose[@]}" --profile '*' logs --no-color || true
            fi
            "${compose[@]}" --profile '*' down --volumes || true
          }
          trap 'cleanup "$?"' EXIT
          smoke() {
            curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 --max-time 3 \
              -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"dob_protocol_version","params":[]}' \
              "http://127.0.0.1:$1" \
              | jq -e '.jsonrpc == "2.0" and .id == 1 and .result == ["dob/0", "dob/1"]'
          }

          # No upstream CKB RPC request is needed for this method.
          [[ $("${compose[@]}" --profile mainnet config --services) == mainnet ]]
          [[ $("${compose[@]}" --profile testnet config --services) == testnet ]]
          "${compose[@]}" --profile mainnet up -d --no-build --pull never
          smoke 8090
          "${compose[@]}" --profile mainnet --profile testnet up -d --no-build --pull never
          smoke 8090
          smoke 8091
          for network in mainnet testnet; do
            "${compose[@]}" --profile "$network" exec -T "$network" sh -ec \
              'test -r settings.toml && test ! -w settings.toml && test -w cache/decoders && test -w cache/dobs'
          done

      - name: Export the tested image
        if: github.event_name == 'push' && github.repository == 'sporeprotocol/dob-decoder-standalone-server'
        working-directory: ${{ runner.temp }}
        run: |
          docker save --output image.tar dob-decoder-server:local
          sha256sum image.tar > image.tar.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.repository == 'sporeprotocol/dob-decoder-standalone-server'
        with:
          name: tested-image-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/image.tar.sha256
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          compression-level: 0

  publish:
    name: Publish the tested multi-platform SHA
    if: >-
      github.event_name == 'push' &&
      github.repository == 'sporeprotocol/dob-decoder-standalone-server' &&
      github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    concurrency:
      group: dob-decoder-image-${{ github.sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tested-image-*
          path: ${{ runner.temp }}/tested
          merge-multiple: false

      - name: Install Skopeo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo

      - name: Verify native builds and publish by digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=ghcr.io/sporeprotocol/dob-decoder-standalone-server
          [[ $GITHUB_SHA =~ ^[a-f0-9]{40}$ ]]
          tag="$image:sha-$GITHUB_SHA"
          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN

          # Never overwrite an existing SHA tag, or treat a registry error as absence.
          if result=$(docker buildx imagetools inspect "$tag" 2>&1); then
            echo "Image tag $tag already exists; leaving it unchanged."
            exit 0
          elif [[ $result != "ERROR: $tag: not found" ]] && ! grep -Fqi 'manifest unknown' <<< "$result"; then
            printf '%s\n' "$result" >&2
            exit 1
          fi

          for arch in amd64 arm64; do
            dir="$RUNNER_TEMP/tested/tested-image-$arch"
            (
              cd "$dir"
              sha256sum --check --strict image.tar.sha256
              skopeo copy --format oci --digestfile digest.txt docker-archive:image.tar oci:layout:image
              skopeo inspect --config oci:layout:image | jq -e --arg arch "$arch" --arg sha "$GITHUB_SHA" \
                '.os == "linux" and .architecture == $arch and .config.Labels["org.opencontainers.image.revision"] == $sha'
            )
          done

          refs=()
          for arch in amd64 arm64; do
            dir="$RUNNER_TEMP/tested/tested-image-$arch"
            digest=$(cat "$dir/digest.txt")
            [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
            skopeo copy --preserve-digests --dest-authfile "$DOCKER_CONFIG/config.json" \
              "oci:$dir/layout:image" "docker://$image@$digest"
            refs+=("$image@$digest")
          done
          docker buildx imagetools create --tag "$tag" "${refs[@]}"
          docker buildx imagetools inspect --raw "$tag" | jq -e \
            --arg amd "${refs[0]##*@}" --arg arm "${refs[1]##*@}" '
              [.manifests[] | [.platform.os, .platform.architecture, .digest]] | sort
              == [["linux","amd64",$amd],["linux","arm64",$arm]]'
          printf 'Published and verified `%s`.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
